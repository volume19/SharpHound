[package]
name = "sharphound"
version = "2.8.0"
edition = "2021"
authors = ["SharpHound Rust Port"]
license = "Apache-2.0"
description = "Active Directory reconnaissance tool for BloodHound (Rust port)"
repository = "https://github.com/SpecterOps/SharpHound"

[dependencies]
# Async runtime and utilities
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = "0.4"

# Collections
dashmap = "6.0"

# Random number generation (for jitter)
rand = "0.8"

# LDAP (will be added when needed)
# ldap3 = "0.11"

# Platform-specific - Windows
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Foundation",
] }
winreg = "0.52"

# Platform-specific - Unix
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }

# Utilities
uuid = { version = "1.10", features = ["v4"] }
base64 = "0.22"

# Compression (for output)
zip = { version = "2.1", features = ["deflate"] }
flate2 = "1.0"

# System info
sysinfo = "0.31"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "sharphound"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
